# Local development / demo.
#   Kafka only (for `make run`):      docker compose up -d          (or podman compose)
#   Kafka + kafpeek container:       docker compose --profile ui up -d --build   (= make demo)
services:
  kafka:
    image: docker.io/apache/kafka:latest
    container_name: kafpeek-dev-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: localhost:9092 for apps on the host (make run / seed),
      # kafka:19092 for containers on the compose network (kafpeek below).
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  kafpeek:
    profiles: ["ui"]
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-}
    image: kafpeek:dev
    container_name: kafpeek
    restart: unless-stopped
    healthcheck: # also declared in the image; repeated here because podman's OCI builds drop it
      test: ["CMD", "/kafpeek", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090" # only reachable from this machine
    environment:
      KAFKA_CLUSTER_NAME: local
      KAFKA_BROKERS: kafka:19092
      KAFKA_AUTH: none
