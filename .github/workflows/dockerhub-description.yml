# Syncs docs/DOCKERHUB.md to the Docker Hub repository page (Docker Hub does
# not read the GitHub README). Runs when the file changes on main, or manually.
#
# Needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; updating the description requires
# an access token with "Read, Write, Delete" permission.
name: dockerhub-description

on:
  push:
    branches: [main]
    paths:
      - docs/DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/kafpeek
          short-description: "UI leve para Apache Kafka: busca CEL no servidor, live tail e AWS MSK IAM. Imagem de ~30 MB."
          readme-filepath: docs/DOCKERHUB.md
