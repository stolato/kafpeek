# Publishes the container image when a version tag (v*) is pushed:
#   docker.io/<DOCKERHUB_USERNAME>/kafpeek  and  ghcr.io/<owner>/kafpeek
# Tags: 0.1.0, 0.1, latest (latest only for releases without a pre-release suffix).
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Read & Write access token).
# GHCR uses the built-in GITHUB_TOKEN.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION file
        run: |
          want="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION file ($want)"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests
        run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kafpeek
            ghcr.io/${{ github.repository_owner }}/kafpeek
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=kafpeek
            org.opencontainers.image.description=Lightweight UI for Apache Kafka with server-side CEL search
            org.opencontainers.image.licenses=MIT

      - name: Version info
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The Dockerfile cross-compiles (Node and Go run on the build platform),
      # so no QEMU emulation is needed for arm64.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
